name: Auto Generate Articles

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install openai

      - name: Generate articles with AI
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: python scripts/generate_article.py

      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Install Hugo theme
        run: |
          rm -rf themes/PaperMod
          git clone https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod --depth=1

      # Build BEFORE committing, so a broken article never gets saved to main
      # and the live site never drifts out of sync with the repository.
      - name: Build site (validates front matter)
        run: hugo --minify --destination public

      - name: Commit and push changes to main
        run: |
          git config user.name "pengjiangwen"
          git config user.email "pengjiangwen@gmail.com"
          git add config/keywords.json content/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: generate daily articles"
          git push

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # Free notification: push to DingTalk group robot on failure.
      - name: Notify on failure (DingTalk)
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python scripts/notify_dingtalk.py
