name: Auto Generate Articles

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install openai

      - name: Record current commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate articles with AI
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: python scripts/generate_article.py

      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Install Hugo theme
        run: |
          rm -rf themes/PaperMod
          git clone https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod --depth=1

      # Build BEFORE committing, so a broken article never gets saved to main
      # and the live site never drifts out of sync with the repository.
      - name: Build site (validates front matter)
        run: hugo --minify --destination public

      - name: Commit and push changes to main
        run: |
          git config user.name "pengjiangwen"
          git config user.email "pengjiangwen@gmail.com"
          git add config/keywords.json content/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: generate daily articles"
          git push

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Check Google indexed pages
        if: success()
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/gsc_indexed_count.py

      - name: Collect publish stats
        if: success()
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          TOTAL=$(find content -name '*.md' | wc -l | tr -d ' ')
          echo "TOTAL_ARTICLES=$TOTAL" >> "$GITHUB_ENV"
          {
            echo "NEW_TITLES<<__EOF__"
            git diff --name-only "$BEFORE_SHA" HEAD -- content/ | grep '\.md$' | while read -r f; do
              sed -n 's/^title:[[:space:]]*//p' "$f" | head -1
            done | sed 's/^"//; s/"$//; s/\\"/"/g'
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Notify success (DingTalk)
        if: success()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          NOTIFY_STATUS: success
        run: python scripts/notify_dingtalk.py

      - name: Notify on failure (DingTalk)
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          NOTIFY_STATUS: failure
        run: python scripts/notify_dingtalk.py
